inherit: [autotools]

metaEnvironment:
    PKG_VERSION: "17.1"
    PKG_LICENSE: "GPL-3.0-or-later"

depends:
    - libs::mpfr-dev
    - libs::gmp-dev
    - libs::readline-dev

    - use: []
      depends:
          - libs::mpfr-tgt
          - libs::gmp-tgt
          - libs::readline-tgt

checkoutSCM:
    scm: url
    url: ${GNU_MIRROR}/gdb/gdb-${PKG_VERSION}.tar.xz
    digestSHA256: "14996f5f74c9f68f5a543fdc45bca7800207f91f92aeea6c2e791822c7c6d876"
    stripComponents: 1

checkoutScript: |
    patchApplySeries $<@gdb/*@>

buildTools: [host-toolchain, perl]

buildScript: |
    autotoolsBuild $1 --with-system-readline
    # shared not yet there, probably because of libtool?

packageScript: |
    autotoolsPackageTgt

provideDeps: [ "*-tgt" ]
